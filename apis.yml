aid: black-ore-technologies
name: Black Ore Technologies
description: >-
  Black Ore Technologies is an Austin, Texas AI company building AI infrastructure for tax and
  financial services. Founded in 2022 by Eyal Shinar (previously founder of the fintech unicorn
  Fundbox) and Pavel Kapovski, the company emerged from stealth in November 2023 with $60 million
  in funding led by Andreessen Horowitz (a16z) and Oak HC/FT. Its flagship product, Tax Autopilot,
  combines proprietary AI with federal and state tax codes to autonomously execute the full
  lifecycle of complex tax returns for Certified Public Accountants and accounting firms, spanning
  document ingestion, intelligent extraction, return preparation, workpaper generation, and tax
  software integration (UltraTax, Lacerte, ProConnect). The platform covers 1040 individual returns
  plus 1041, 1065, and Schedule K-1/K-3 automation, and is used by 40% of the top 20 leading firms.
  Black Ore does not publish a public developer API or OpenAPI at this time; its authentication is
  handled by an Auth0-hosted OpenID Connect tenant at auth.blackore.ai.
